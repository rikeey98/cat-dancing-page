<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="35" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,55 80,35 95,50" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <polygon points="105,50 120,35 125,55" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="78,50 82,42 88,48" fill="#FFB366"/>
  <polygon points="112,48 118,42 122,50" fill="#FFB366"/>

  <!-- Cat eyes -->
  <circle cx="90" cy="75" r="6" fill="#2D5016"/>
  <circle cx="110" cy="75" r="6" fill="#2D5016"/>
  <circle cx="88" cy="73" r="2" fill="#FFFFFF"/>
  <circle cx="108" cy="73" r="2" fill="#FFFFFF"/>

  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#FF1744"/>

  <!-- Cat mouth -->
  <path d="M 100 92 Q 95 96 90 94" stroke="#2D5016" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 105 96 110 94" stroke="#2D5016" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="70" y1="80" x2="85" y2="82" stroke="#2D5016" stroke-width="2"/>
  <line x1="70" y1="87" x2="85" y2="87" stroke="#2D5016" stroke-width="2"/>
  <line x1="115" y1="82" x2="130" y2="80" stroke="#2D5016" stroke-width="2"/>
  <line x1="115" y1="87" x2="130" y2="87" stroke="#2D5016" stroke-width="2"/>

  <!-- Cat tail -->
  <path d="M 145 135 Q 170 120 180 140 Q 175 155 160 150 Q 150 145 145 135" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="75" cy="165" rx="10" ry="8" fill="#FF6B1A"/>
  <ellipse cx="125" cy="165" rx="10" ry="8" fill="#FF6B1A"/>

  <!-- Cat stripes -->
  <path d="M 85 65 Q 100 60 115 65" stroke="#FF6B1A" stroke-width="3" fill="none"/>
  <path d="M 80 120 Q 100 115 120 120" stroke="#FF6B1A" stroke-width="3" fill="none"/>
  <path d="M 85 140 Q 100 135 115 140" stroke="#FF6B1A" stroke-width="3" fill="none"/>
</svg>